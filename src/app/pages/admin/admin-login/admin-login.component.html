<div class="admin-login-page">
  <div class="al-card">
    <div class="al-header">
      <div class="al-logo serif">Invitel<span>y</span></div>
      <div class="al-badge">Admin access</div>
      <h1 class="serif al-title">Sign in to admin</h1>
      <p class="al-sub">Authorised personnel only. Sessions expire after 5 minutes of inactivity.</p>
    </div>

    <form (ngSubmit)="submit()" (keydown)="resetInactivityTimer()">
      <div class="form-group">
        <label for="email">Admin email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="admin@invitely.app" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Admin password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-error" *ngIf="error">{{ error }}</div>
      <button type="submit" class="btn btn-primary al-submit" [disabled]="loading">
        <span *ngIf="!loading">Sign in to admin panel</span>
        <span *ngIf="loading" class="btn-loading"><span class="spinner"></span> Signing in...</span>
      </button>
    </form>

    <div class="al-warning">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      All admin actions are logged and monitored.
    </div>
  </div>
</div>
